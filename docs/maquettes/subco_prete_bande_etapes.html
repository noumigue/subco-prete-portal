<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prochaines étapes — SUBCO-PRETE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --white: #FFFFFF; --off: #F7F6F3; --surface: #EEECEA; --border: #DDDBD7;
  --text: #1A1917; --muted: #6B6965; --accent: #1B5E3B;
  --accent-l: #E8F2EC; --accent-b: #C2DDD0;
  --r: 6px; --r-lg: 12px;
}
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--off); color: var(--text);
  padding: 48px 24px; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 880px; margin: 0 auto; }

/* BAND */
.band {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 28px 32px;
}
.band-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
}
.band-eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 5px;
}
.band-title {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 22px; font-weight: 400; color: var(--text);
}

/* TABS */
.tabs { display: flex; gap: 6px; }
.tab {
  font-size: 12px; font-weight: 500; padding: 6px 16px;
  border-radius: 20px; cursor: pointer; transition: all .15s;
  border: 1px solid var(--border); user-select: none;
}
.tab.on { background: var(--text); color: #fff; border-color: var(--text); }
.tab.off { background: var(--white); color: var(--muted); }
.tab.off:hover { border-color: var(--text); color: var(--text); }
.tab .soon { font-size: 9px; opacity: .5; margin-left: 3px; }

/* TIMELINE */
.tl-wrap { position: relative; padding: 8px 0 24px; }
.tl-line {
  position: absolute; top: 19px;
  left: calc(10% + 14px); right: calc(10% + 14px);
  height: 2px; background: var(--border); z-index: 0;
}
.tl-progress {
  position: absolute; top: 19px;
  left: calc(10% + 14px);
  height: 2px; background: var(--accent); z-index: 1;
  width: 0; transition: width 1s cubic-bezier(.16, 1, .3, 1);
}
.steps {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 8px; position: relative; z-index: 2;
}
.step {
  display: flex; flex-direction: column;
  align-items: center; text-align: center; gap: 6px;
}

/* Dots */
.dot {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.dot.done { background: var(--accent); }
.dot.done svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; }
.dot.active {
  width: 30px; height: 30px; background: var(--accent);
  box-shadow: 0 0 0 6px rgba(27, 94, 59, .12);
  margin-top: -3px;
  animation: pulse 2s ease-in-out infinite;
}
.dot.active::after {
  content: ''; width: 11px; height: 11px;
  border-radius: 50%; background: #fff;
}
.dot.upcoming { background: var(--off); border: 1.5px solid var(--border); }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 6px rgba(27,94,59,.12); }
  50% { box-shadow: 0 0 0 8px rgba(27,94,59,.06); }
}

/* Step labels */
.step-name { font-size: 11px; font-weight: 500; line-height: 1.3; }
.step-name.done { color: var(--muted); }
.step-name.active { font-size: 12px; color: var(--accent); }
.step-name.upcoming { color: var(--text); }
.step-date { font-size: 10px; color: var(--muted); }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 9px; font-weight: 500; padding: 2px 8px;
  border-radius: 20px; white-space: nowrap;
}
.badge.done { background: var(--off); color: var(--muted); border: 1px solid var(--border); }
.badge.active { background: var(--accent-l); color: var(--accent); border: 1px solid var(--accent-b); }
.badge.upcoming { background: var(--off); color: var(--muted); border: 1px dashed var(--border); }
.badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

/* Footer */
.band-footer {
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border); padding-top: 14px;
  flex-wrap: wrap; gap: 8px;
}
.footer-note { font-size: 11px; color: var(--muted); }
.footer-link { font-size: 12px; color: var(--accent); font-weight: 500; text-decoration: none; }
.footer-link:hover { text-decoration: underline; }

@media (max-width: 600px) {
  .band { padding: 20px 16px; }
  .band-header { flex-direction: column; align-items: flex-start; }
  .steps { grid-template-columns: repeat(3, 1fr); }
  .step-hide { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="band">
    <div class="band-header">
      <div>
        <div class="band-eyebrow">Calendrier du programme</div>
        <div class="band-title">Prochaines étapes</div>
      </div>
      <div class="tabs">
        <div class="tab on" id="tab1" onclick="switchTab(1)">Cohorte 1 — Phase pilote</div>
        <div class="tab off" id="tab2" onclick="switchTab(2)">Cohorte 2<span class="soon">bientôt</span></div>
      </div>
    </div>

    <div class="tl-wrap">
      <div class="tl-line"></div>
      <div class="tl-progress" id="tl-prog"></div>
      <div class="steps" id="steps"></div>
    </div>

    <div class="band-footer">
      <div class="footer-note" id="footer-note"></div>
      <a class="footer-link" href="#">Voir le calendrier complet →</a>
    </div>
  </div>
</div>

<script>
const cohortes = {
  1: [
    { n: 'Publication AMI',           d: 'Mai 2026',       s: 'done'     },
    { n: 'Ateliers régionaux',        d: 'Mai–Juin 2026',  s: 'done'     },
    { n: 'Clôture des candidatures',  d: '15 juin 2026',   s: 'done'     },
    { n: 'Instruction des dossiers',  d: 'Juil. 2026',     s: 'active'   },
    { n: 'Comité de sélection',       d: 'Août 2026',      s: 'upcoming' },
    { n: 'Publication des résultats', d: 'Août 2026',      s: 'upcoming' },
    { n: 'Contractualisation',        d: 'Sept. 2026',     s: 'upcoming' },
  ],
  2: [
    { n: 'Préparation AMI',           d: 'Oct. 2026',      s: 'upcoming' },
    { n: 'Publication AMI',           d: 'Nov. 2026',      s: 'upcoming' },
    { n: 'Ateliers régionaux',        d: 'Nov.–Déc. 2026', s: 'upcoming' },
    { n: 'Clôture des candidatures',  d: 'Jan. 2027',      s: 'upcoming' },
    { n: 'Instruction',               d: 'Fév. 2027',      s: 'upcoming' },
    { n: 'Comité de sélection',       d: 'Mars 2027',      s: 'upcoming' },
    { n: 'Publication des résultats', d: 'Avr. 2027',      s: 'upcoming' },
  ]
};

let cur = 1;

function getWindow(all) {
  const ai = all.findIndex(s => s.s === 'active');
  if (ai === -1) return all.slice(0, 5);
  const start = Math.max(0, ai - 2);
  return all.slice(start, Math.min(all.length, start + 5));
}

function render() {
  const all = cohortes[cur];
  const win = getWindow(all);
  const done = all.filter(s => s.s === 'done').length;
  const pct = done / (all.length - 1) * 100;

  const prog = document.getElementById('tl-prog');
  prog.style.width = '0';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { prog.style.width = pct + '%'; });
  });

  document.getElementById('steps').innerHTML = win.map(step => {
    let dot = '', nc = '', badge = '';

    if (step.s === 'done') {
      dot = `<div class="dot done"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>`;
      nc = 'done';
      badge = `<span class="badge done">Terminé</span>`;
    } else if (step.s === 'active') {
      dot = `<div class="dot active"></div>`;
      nc = 'active';
      badge = `<span class="badge active"><span class="badge-dot"></span>En cours</span>`;
    } else {
      dot = `<div class="dot upcoming"></div>`;
      nc = 'upcoming';
      badge = `<span class="badge upcoming">À venir</span>`;
    }

    return `
      <div class="step">
        ${dot}
        <div class="step-name ${nc}">${step.n}</div>
        <div class="step-date">${step.d}</div>
        ${badge}
      </div>`;
  }).join('');

  const label = cur === 1 ? 'Cohorte 1, Phase pilote' : 'Cohorte 2';
  document.getElementById('footer-note').textContent =
    `${done} / ${all.length} étapes complétées — ${label}`;
}

function switchTab(n) {
  cur = n;
  document.getElementById('tab1').className = 'tab ' + (n === 1 ? 'on' : 'off');
  document.getElementById('tab2').className = 'tab ' + (n === 2 ? 'on' : 'off');
  render();
}

render();
</script>
</body>
</html>
